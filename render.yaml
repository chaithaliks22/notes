services:
  - type: web
    name: notenest-app
    env: node
    plan: free
    buildCommand: node build.js
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # User enters this in Render dashboard
